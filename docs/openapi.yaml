openapi: 3.0.3
info:
  title: SkillBridge API
  version: 0.1.0
  description: |
    API contract, phase 1: authentication, user profile and skills catalogue.
    Any change to this file goes through a Pull Request approved by both team members.

servers:
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Skills
  - name: Matches
  - name: Availability
  - name: Sessions

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      tags: [Users]
      summary: Get the profile of the signed-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update the profile of the signed-in user
      description: |
        Replaces the editable profile fields and the full list of skills
        (teach / learn) of the current user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /skills:
    get:
      tags: [Skills]
      summary: List the skills catalogue
      description: Public list of skills, optionally filtered by category or text.
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/SkillCategory'
        - name: q
          in: query
          description: Text search on the skill name
          schema:
            type: string
      responses:
        '200':
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'

  /users:
    get:
      tags: [Users]
      summary: Search users
      description: |
        Lists other users (the signed-in user is never included), 20 per page by default.
        The filters `skill`, `type`, `category`, `level` and `mode` all apply to the SAME
        skill entry of a user, and that entry must have the given `type` (default `teach`).
        Example: `?category=diy&mode=in_person` returns users who teach a DIY skill in person.
        `university`, `city` and `q` (name) are case-insensitive "contains" searches.
      security:
        - bearerAuth: []
      parameters:
        - name: skill
          in: query
          description: Skill id
          schema: { type: integer }
        - name: type
          in: query
          description: Which side of the skill to match
          schema: { type: string, enum: [teach, learn], default: teach }
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/SkillCategory'
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/SkillLevel'
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/SkillMode'
        - name: university
          in: query
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Text search on the user name
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get the public profile of a user
      description: Same as a profile but without the e-mail address.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The user's public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /matches:
    get:
      tags: [Matches]
      summary: Suggested matches for the signed-in user
      description: |
        Users whose skills complement mine, best score first. Only users with at least
        one overlap are returned.

        Score (0 to 100) = average of two percentages:
        - how much of what I want to learn they can teach me
          (skills they teach that I want to learn / skills I want to learn)
        - how much of what I teach they want to learn
          (skills I teach that they want to learn / skills I teach)
        A side counts as 0 if its denominator is 0. A one-sided overlap therefore scores
        at most 50, which rewards real exchanges.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matches, sorted by descending score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/availability:
    put:
      tags: [Availability]
      summary: Replace my weekly availability
      description: |
        Replaces the whole list of weekly windows (an empty list clears it).
        Version 1: all times are in Tunisia time (UTC+1, no daylight saving).
        Windows on the same weekday must not overlap, and each window must end after it starts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      responses:
        '200':
          description: The saved windows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}/availability:
    get:
      tags: [Availability]
      summary: Get a teacher's weekly windows and busy slots
      description: |
        `windows` is the weekly availability. `busy` lists the accepted sessions of that
        user in the next 60 days, so the calendar can grey them out.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Availability of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions:
    post:
      tags: [Sessions]
      summary: Request a session with a teacher
      description: |
        Creates a session with status `pending`. The request is rejected with 400 if the
        slot is in the past, does not start on a half hour, does not fit entirely inside one
        of the teacher's weekly windows, if the skill is not one the teacher teaches, or if
        the teacher is the signed-in user. It is rejected with 409 if the teacher or the
        learner already has an `accepted` session overlapping the slot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Teacher not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slot no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Sessions]
      summary: List my sessions (as teacher or learner)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - name: role
          in: query
          description: Only sessions where I am the teacher or the learner
          schema: { type: string, enum: [teacher, learner] }
        - name: when
          in: query
          description: Upcoming (not ended yet, soonest first) or past (most recent first)
          schema: { type: string, enum: [upcoming, past] }
      responses:
        '200':
          description: My sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/{id}/status:
    patch:
      tags: [Sessions]
      summary: Change the status of a session
      description: |
        Allowed changes:
        - `accepted` or `declined`: teacher only, session must be `pending`.
          Accepting re-checks conflicts and fails with 409 if another accepted session overlaps.
        - `cancelled`: teacher or learner, session must be `pending` or `accepted` and not started yet.
        - `completed`: teacher or learner, session must be `accepted` and already ended.
        Any other change fails with 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionStatusRequest'
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This user is not allowed to make this change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found, or the user is not a participant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invalid status change, or conflict with another accepted session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SkillCategory:
      type: string
      enum:
        - tech
        - design
        - languages
        - diy
        - daily_life
        - academic
        - music_arts
        - career

    SkillLevel:
      type: string
      enum: [beginner, intermediate, advanced]

    SkillMode:
      type: string
      enum: [online, in_person, both]

    Skill:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Python
        category:
          $ref: '#/components/schemas/SkillCategory'

    UserSkill:
      type: object
      required: [skillId, type, level, mode]
      properties:
        skillId:
          type: integer
          example: 12
        type:
          type: string
          enum: [teach, learn]
        level:
          $ref: '#/components/schemas/SkillLevel'
        mode:
          $ref: '#/components/schemas/SkillMode'
        skill:
          allOf:
            - $ref: '#/components/schemas/Skill'
          readOnly: true

    User:
      type: object
      required: [id, name, email, skills]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sarah Ben Ali
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
          example: SUP'COM
        year:
          type: integer
          nullable: true
          example: 2
        city:
          type: string
          nullable: true
          example: Tunis
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkill'

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'JWT to send in the header Authorization, as: Bearer <token>'
        user:
          $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        bio:
          type: string
          maxLength: 500
          nullable: true
        university:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        city:
          type: string
          nullable: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkill'
    PublicUser:
      type: object
      required: [id, name, skills]
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        city:
          type: string
          nullable: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/UserSkill'

    PaginatedUsers:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicUser'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Total number of users matching the filters

    Match:
      type: object
      required: [user, score, theyTeachMe, iTeachThem]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 92
        theyTeachMe:
          type: array
          description: Skills they teach that I want to learn
          items:
            $ref: '#/components/schemas/Skill'
        iTeachThem:
          type: array
          description: Skills I teach that they want to learn
          items:
            $ref: '#/components/schemas/Skill'
    AvailabilityWindow:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = Monday ... 7 = Sunday
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '18:00'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '20:00'

    AvailabilityRequest:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityWindow'

    TimeRange:
      type: object
      required: [startAt, endAt]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time

    TeacherAvailability:
      type: object
      required: [windows, busy]
      properties:
        windows:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityWindow'
        busy:
          type: array
          items:
            $ref: '#/components/schemas/TimeRange'

    SessionStatus:
      type: string
      enum: [pending, accepted, declined, completed, cancelled]

    UserSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    Session:
      type: object
      required: [id, teacher, learner, skill, startAt, endAt, status, createdAt]
      properties:
        id:
          type: integer
        teacher:
          $ref: '#/components/schemas/UserSummary'
        learner:
          $ref: '#/components/schemas/UserSummary'
        skill:
          $ref: '#/components/schemas/Skill'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SessionStatus'
        message:
          type: string
          nullable: true
          description: Optional note from the learner
        meetingLink:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateSessionRequest:
      type: object
      required: [teacherId, skillId, startAt, durationMinutes]
      properties:
        teacherId:
          type: integer
        skillId:
          type: integer
        startAt:
          type: string
          format: date-time
          description: ISO 8601, must start on the hour or half hour (Tunisia time)
          example: '2026-11-16T18:00:00+01:00'
        durationMinutes:
          type: integer
          enum: [30, 60, 90, 120]
        message:
          type: string
          maxLength: 300
          nullable: true

    UpdateSessionStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, declined, cancelled, completed]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Email already used
        details:
          type: array
          description: Field-level errors, when relevant
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string



